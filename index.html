
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#10172a">
  <title>NOVA AI</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background: #10172a;
      color: white;
      text-align: center;
      min-height: 100vh;
      padding: 25px 15px;
    }
    header { padding: 35px 10px; }
    h1 {
      font-size: 42px;
      color: #62d9ff;
      margin-bottom: 8px;
    }
    .subtitle { color: #b7c6dd; }
    .features {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 14px;
      max-width: 650px;
      margin: auto;
    }
    .feature {
      background: #1d2942;
      border: 1px solid #344563;
      border-radius: 15px;
      padding: 22px 10px;
      font-size: 16px;
    }
    .feature span {
      display: block;
      font-size: 30px;
      margin-bottom: 12px;
    }
    footer {
      color: #91a2bd;
      margin-top: 40px;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <header>
    <h1>NOVA AI</h1>
    <p class="subtitle">دستیار هوشمند شخصی شما</p>
    <p>به دنیای هوش مصنوعی خوش آمدید</p>
  </header>

  <main class="features">
    <div class="feature"><span>💬</span>گفت‌وگوی هوشمند</div>
    <div class="feature"><span>🎙️</span>دستیار صوتی</div>
    <div class="feature"><span>🎨</span>ساخت تصویر</div>
    <div class="feature"><span>🎬</span>ساخت ویدئو</div>
    <div class="feature"><span>✍️</span>قلم هوشمند</div>
    <div class="feature"><span>🌍</span>مترجم هوشمند</div>
    <div class="feature"><span>🇮🇷</span>پشتیبانی فارسی</div>
  </main>

  <footer>
    NOVA AI © 2026
    <p>نسخه اولیه - در حال توسعه</p>
  </footer>
</body>
</html>
