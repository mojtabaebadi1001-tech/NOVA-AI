<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#10172a">
<title>NOVA AI - گفت‌وگوی هوشمند</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#10172a;color:#fff;font-family:Tahoma,Arial,sans-serif;display:flex;flex-direction:column;height:100dvh}
header{padding:18px;background:#172b4d;text-align:center;color:#55d6ff;font-size:22px;font-weight:bold}
#status{text-align:center;color:#b8c7dc;font-size:12px;padding:7px}
#messages{flex:1;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:12px}
.msg{padding:13px;border-radius:15px;max-width:88%;line-height:1.9;white-space:pre-wrap;overflow-wrap:anywhere}
.bot{background:#263b5b;align-self:flex-start}
.user{background:#087eaa;align-self:flex-end}
form{display:flex;gap:8px;padding:12px;background:#172b4d}
input{flex:1;min-width:0;padding:14px;border:0;border-radius:12px;font-size:15px;outline:none}
button{border:0;border-radius:12px;background:#16a6d2;color:white;padding:12px 18px;font-size:15px}
button:disabled{opacity:.55}
</style>
</head>
<body>
<header>✨ NOVA AI</header>
<div id="status">دستیار هوشمند فارسی</div>
<div id="messages"><div class="msg bot">سلام! من نوا هستم. 🤖
پیامت را بنویس تا پاسخ بدهم.</div></div>
<form id="chatForm">
<input id="messageInput" placeholder="پیامت را بنویس..." autocomplete="off" required>
<button id="sendButton" type="submit">ارسال</button>
</form>
<script>
const API_URL = "https://throbbing-thunder-c3b3.sayedmujtabaebadi2.workers.dev";
const form = document.getElementById("chatForm");
const input = document.getElementById("messageInput");
const messagesEl = document.getElementById("messages");
const sendButton = document.getElementById("sendButton");
const conversation = [];
function addMessage(text, kind) {
  const el = document.createElement("div");
  el.className = "msg " + kind;
  el.textContent = text;
  messagesEl.appendChild(el);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return el;
}
form.addEventListener("submit", async (event) => {
  event.preventDefault();
  const text = input.value.trim();
  if (!text || sendButton.disabled) return;
  addMessage(text, "user");
  input.value = "";
  conversation.push({ role: "user", content: text });
  sendButton.disabled = true;
  const waiting = addMessage("نوا در حال فکر کردن است…", "bot");
  try {
    const response = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: conversation })
    });
    const data = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(data.error || "خطا در ارتباط با موتور هوش مصنوعی");
    if (!data.reply) throw new Error("پاسخ معتبری از سرور دریافت نشد");
    waiting.textContent = data.reply;
    conversation.push({ role: "assistant", content: data.reply });
  } catch (error) {
    waiting.textContent = "ارتباط با نوا برقرار نشد: " + error.message + "\nلطفاً تنظیمات Worker و اتصال AI را بررسی کن.";
    conversation.pop();
  } finally {
    sendButton.disabled = false;
    input.focus();
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }
});
</script>
</body>
</html>
